<div class="watch-window-panel" *ngIf="currentVariables">
  <h3>Variables</h3>
  <table class="watch-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Value</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of currentVariables | keyvalue">
        <td class="var-name">{{ item.key }}</td>
        <td class="var-value">{{ item.value }}</td>
      </tr>
    </tbody>
  </table>
</div>
